services:
  - type: web
    name: saas-platform-backend
    runtime: python
    buildCommand: cd backend && pip install --upgrade pip && pip install poetry && poetry config virtualenvs.create false && poetry install --only main
    startCommand: cd backend && poetry run alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: saas-platform-frontend
    runtime: node
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    plan: free
