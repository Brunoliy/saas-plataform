version: '3.8'

services:
  # PostgreSQL Database for CI/CD
  postgres-ci:
    image: postgres:15-alpine
    container_name: saas_platform_postgres_ci
    environment:
      POSTGRES_DB: saas_platform_test
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: saas_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_ci_data:/var/lib/postgresql/data
    networks:
      - saas_platform_ci_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_platform_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache for CI/CD
  redis-ci:
    image: redis:7-alpine
    container_name: saas_platform_redis_ci
    ports:
      - "6379:6379"
    volumes:
      - redis_ci_data:/data
    networks:
      - saas_platform_ci_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka for CI/CD
  kafka-ci:
    image: confluentinc/cp-kafka:7.4.0
    container_name: saas_platform_kafka_ci
    depends_on:
      - zookeeper-ci
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-ci:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-ci:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - saas_platform_ci_network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Zookeeper for CI/CD
  zookeeper-ci:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: saas_platform_zookeeper_ci
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - saas_platform_ci_network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_ci_data:
  redis_ci_data:

networks:
  saas_platform_ci_network:
    driver: bridge 